<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10121a"><title>KOLO DEMO ŠTĚSTÍ • Minka</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body>
<header><a class="brand" href="/"><span class="brandmark">✳</span> KOLO DEMO<span class="muted">ŠTĚSTÍ</span></a><div class="tools"><button id="sound" aria-pressed="true">♫ <span>Zvuk zapnutý</span></button><button id="fullscreen" aria-label="Celá obrazovka">⛶</button><button id="admin">⚙ <span>Administrace</span></button></div></header>
<p id="status" class="sr-only" role="status" aria-live="polite"></p><main>
<div class="arena"><section class="wheel-section" aria-label="Losovací kolo"><div class="wheel-halo"></div><div class="wheel-wrap"><div class="pointer"></div><canvas id="wheel" width="1200" height="1200" role="img" aria-label="Kolo se jmény účastníků"></canvas><button id="spin" class="hub" type="button" aria-label="Roztočit kolo" title="Roztočit kolo"><span class="spin-icon" aria-hidden="true">↻</span><small id="spin-label">ROZTOČIT</small></button></div><div class="wheel-base"></div></section>
<aside><section class="intro"><h1>Příští demo Level Up povede</h1><div id="current-presenter" class="current-presenter" aria-live="polite"></div></section></aside></div>
<footer><span>ŠTĚSTÍ PŘEJE ODVÁŽNÝM.</span><span>minka.cz <span class="orange">✳</span></span></footer></main>
<dialog id="admin-dialog"><form id="login-form"><div class="card-top"><h2>Administrace</h2><button type="button" class="close" data-close="admin-dialog" aria-label="Zavřít">×</button></div><p>Správa účastníků a nového kola losování.</p><label>Heslo administrátora<input id="password" type="password" autocomplete="current-password" required></label><button class="primary">Odemknout administraci</button></form><div id="admin-panel" hidden><div class="card-top"><h2>Účastníci</h2><button class="close" data-close="admin-dialog" aria-label="Zavřít">×</button></div><form id="add-form"><label for="names">Jméno a příjmení</label><textarea id="names" rows="4" placeholder="Tomáš Minka&#10;Jana Nováková" required></textarea><p class="caption">Vlož i více jmen, každé na nový řádek. Duplicity přeskočíme.</p><button class="primary">Přidat účastníky +</button></form><div id="admin-list"></div><button id="reset" class="danger">↺ Vrátit všechny kolegy do hry</button><p id="reset-status" role="status" aria-live="polite"></p></div><p id="admin-error" role="alert"></p></dialog>
<dialog id="winner-dialog"><div class="winner-content"><div class="trophy">✦</div><div class="eyebrow">TENHLE OKAMŽIK PATŘÍ TOBĚ</div><h2>Máme vítěze!</h2><div id="winner-name"></div><p>povede další Level Up demo</p><button id="continue" class="primary">Pokračovat v losování ↗</button></div></dialog><canvas id="confetti" aria-hidden="true"></canvas><div id="toast" role="alert"></div>
</body></html>
